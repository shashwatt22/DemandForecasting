name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint v2 models and forecasting API
        run: |
          python -m pip install ruff
          ruff check --select E4,E7,E9,F63,F7,F82 src/models/leakage_safe_v2.py src/evaluation/public_backtesting.py api/main.py dashboard/pages/3_Leakage_Safe_V2.py
      - name: Run pytest
        run: pytest -q
