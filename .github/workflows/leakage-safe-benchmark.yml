name: Leakage-safe forecasting research benchmark
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "src/evaluation/leakage_safe_benchmark.py"
      - ".github/workflows/leakage-safe-benchmark.yml"
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m src.evaluation.leakage_safe_benchmark
      - uses: actions/upload-artifact@v4
        with:
          name: leakage-safe-forecast-diagnostics
          path: results/leakage_safe_diagnostic.json
