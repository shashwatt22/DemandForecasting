name: Public forecasting development backtests
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "src/evaluation/public_backtesting.py"
      - ".github/workflows/public-backtests.yml"
jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy pandas statsmodels openpyxl
      - run: python -m src.evaluation.public_backtesting
      - uses: actions/upload-artifact@v4
        with:
          name: public-development-backtest
          path: results/public_development_backtest.json
