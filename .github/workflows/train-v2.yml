name: Train v2 leakage-safe forecasting models
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "src/models/leakage_safe_v2.py"
      - ".github/workflows/train-v2.yml"
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install training dependencies
        run: python -m pip install numpy pandas scikit-learn xgboost lightgbm statsmodels joblib openpyxl
      - name: Train using development only
        run: python -m src.models.leakage_safe_v2
      - uses: actions/upload-artifact@v4
        with:
          name: v2-leakage-safe-trained-models
          path: models/v2/*.joblib
      - name: Version trained artifacts for deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/v2/*.joblib
          if git diff --cached --quiet; then
            echo "Models unchanged."
          else
            git commit -m "Train and publish leakage-safe v2 models from development data [skip ci]"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
