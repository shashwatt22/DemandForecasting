name: V2 Streamlit end-to-end smoke
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "dashboard/pages/3_Leakage_Safe_V2.py"
      - "tests/test_v2_ui_smoke.py"
      - ".github/workflows/v2-ui-smoke.yml"
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/test_v2_ui_smoke.py -q
