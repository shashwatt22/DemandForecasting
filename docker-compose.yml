services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      - FORECAST_API_URL=http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped
